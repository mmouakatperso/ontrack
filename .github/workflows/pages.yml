# ONTRACK — tests puis publication de la démonstration sur GitHub Pages.
# Seuls les fichiers du site sont publiés (pas _bmad, docs, tests ni outillage).
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: |
          node --test tests/*.test.cjs
          for f in *.js; do node --check "$f"; done

      - name: Assemblage du site
        run: |
          mkdir _site
          cp index.html styles.css robots.txt sitemap.xml *.js _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
